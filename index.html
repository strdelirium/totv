<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTV — Киберспортивная платформа</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07050c;
            --card-bg: rgba(22, 14, 38, 0.65);
            --accent-purple: #9d4edd;
            --accent-neon: #d55cff;
            --text-main: #f5f2ff;
            --text-muted: #9b8cb8;
            --border-glass: rgba(180, 110, 255, 0.16);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Фиолетовое неоновое свечение на фоне */
        .bg-glow {
            position: fixed;
            width: 580px;
            height: 580px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.28;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }
        .glow-1 { top: -140px; left: -100px; background: #7b2cbf; }
        .glow-2 { bottom: -140px; right: -100px; background: #c77dff; animation-delay: -5s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(45px, 35px) scale(1.12); }
        }

        /* Шапка */
        header {
            background: rgba(11, 7, 20, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-wrap { display: flex; align-items: center; gap: 12px; }

        .logo-badge {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: linear-gradient(135deg, #5a189a, #c77dff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 18px rgba(199, 125, 255, 0.6);
        }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(199, 125, 255, 0.4);
        }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }

        nav button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        nav button:hover {
            color: #fff;
            background: rgba(199, 125, 255, 0.1);
        }

        nav button.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.35), rgba(213, 92, 255, 0.2));
            border: 1px solid rgba(213, 92, 255, 0.6);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        main { max-width: 1050px; margin: 40px auto; padding: 0 20px; }

        .page { display: none; animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Главный баннер */
        .hero {
            background: linear-gradient(135deg, rgba(32, 18, 58, 0.85), rgba(14, 9, 26, 0.92));
            border: 1px solid var(--border-glass);
            border-left: 4px solid var(--accent-neon);
            border-radius: 14px;
            padding: 35px;
            margin-bottom: 40px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(157, 78, 221, 0.12);
        }

        .hero h1 { font-size: 30px; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        .hero p { color: var(--text-muted); line-height: 1.6; font-size: 15px; max-width: 780px; }
        .hero strong { color: #e0aaff; }

        .section-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background: var(--accent-neon);
            border-radius: 3px;
            box-shadow: 0 0 12px var(--accent-neon);
        }

        /* Карточки */
        .top3-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 20px;
            margin-bottom: 45px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(213, 92, 255, 0.55);
            box-shadow: 0 12px 30px rgba(123, 44, 191, 0.3);
        }

        .card.rank-1 { border-top: 3px solid #ffd700; }
        .card.rank-2 { border-top: 3px solid #e0aaff; }
        .card.rank-3 { border-top: 3px solid #9d4edd; }

        .rank-badge {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #e0aaff;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .points-pill {
            background: rgba(157, 78, 221, 0.25);
            border: 1px solid rgba(213, 92, 255, 0.5);
            color: #f3d5ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .team-name { font-size: 22px; font-weight: 900; margin-bottom: 14px; color: #fff; }
        .roster { display: flex; flex-wrap: wrap; gap: 6px; }
        .player-tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(199, 125, 255, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #e6d9ff;
        }

        /* Таблица рейтинга */
        .table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            overflow-x: auto;
            backdrop-filter: blur(12px);
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            background: rgba(157, 78, 221, 0.12);
            color: #d8bbff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            text-align: left;
        }
        td { padding: 18px 20px; border-top: 1px solid var(--border-glass); font-size: 14px; }
        tr { transition: background 0.2s ease; }
        tr:hover { background: rgba(199, 125, 255, 0.07); }

        .pts-cell { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 20px; color: var(--accent-neon); }

        .btn-glow {
            display: inline-block;
            margin-top: 16px;
            background: linear-gradient(90deg, #7b2cbf, #c77dff);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(157, 78, 221, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(213, 92, 255, 0.8); }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-glass);
            margin-top: 60px;
        }

        @media (max-width: 650px) {
            header { flex-direction: column; gap: 15px; padding: 15px; }
            .hero { padding: 22px; }
            .hero h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <header>
        <div class="logo-wrap">
            <div class="logo-badge">И</div>
            <div class="logo">TOTV // ESPORTS</div>
        </div>
        <nav>
            <button class="tab-btn active" onclick="openPage('home', this)">Главная</button>
