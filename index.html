<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTV — Киберспортивная платформа</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: rgba(20, 25, 38, 0.65);
            --accent-orange: #ff5500;
            --accent-blue: #00d2ff;
            --text-main: #f4f6f9;
            --text-muted: #8a94a6;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.22;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }
        .glow-1 { top: -120px; left: -100px; background: var(--accent-orange); }
        .glow-2 { bottom: -120px; right: -100px; background: var(--accent-blue); animation-delay: -5s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        header {
            background: rgba(12, 15, 23, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 85, 0, 0.3);
        }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }

        nav button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        nav button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        nav button.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(255, 85, 0, 0.25), rgba(0, 210, 255, 0.15));
            border: 1px solid rgba(255, 85, 0, 0.5);
            box-shadow: 0 0 18px rgba(255, 85, 0, 0.25);
        }

        main {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page { display: none; animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero {
            background: linear-gradient(135deg, rgba(25, 31, 48, 0.8), rgba(13, 17, 26, 0.9));
            border: 1px solid var(--border-glass);
            border-left: 4px solid var(--accent-orange);
            border-radius: 14px;
            padding: 35px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .hero h1 {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .hero p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 15px;
            max-width: 750px;
        }

        .section-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background: var(--accent-blue);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .top3-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 20px;
            margin-bottom: 45px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 24px;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .card.rank-1 { border-top: 3px solid #ffd700; box-shadow: 0 8px 25px rgba(255, 215, 0, 0.08); }
        .card.rank-2 { border-top: 3px solid #c0c0c0; }
        .card.rank-3 { border-top: 3px solid #cd7f32; }

        .rank-badge {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-orange);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .points-pill {
            background: rgba(255, 85, 0, 0.15);
            border: 1px solid rgba(255, 85, 0, 0.4);
            color: #ff8c52;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .team-name {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 14px;
            color: #fff;
        }

        .roster {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .player-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #d1d8e5;
        }

        .table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            text-align: left;
        }
        td {
            padding: 18px 20px;
            border-top: 1px solid var(--border-glass);
            font-size: 14px;
        }
        tr { transition: background 0.2s ease; }
        tr:hover { background: rgba(255, 255, 255, 0.03); }

        .pts-cell {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--accent-blue);
        }

        .btn-glow {
            display: inline-block;
            margin-top: 15px;
            background: linear-gradient(90deg, var(--accent-orange), #ff2a00);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 28px rgba(255, 85, 0, 0.7);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-glass);
            margin-top: 60px;
        }

        @media (max-width: 650px) {
            header { flex-direction: column; gap: 15px; padding: 15px; }
            .hero { padding: 22px; }
            .hero h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <header>
        <div class="logo">TOTV // ESPORTS</div>
        <nav>
            <button class="tab-btn active" onclick="openPage('home', this)">Главная</button>
            <button class="tab-btn" onclick="openPage('tournaments', this)">Турниры</button>
            <button class="tab-btn" onclick="openPage('rating', this)">Рейтинг команд</button>
            <button class="tab-btn" onclick="openPage('hall', this)">Зал славы</button>
        </nav>
    </header>

    <main>
        <!-- ГЛАВНАЯ -->
        <section id="home" class="page active">
            <div class="hero">
